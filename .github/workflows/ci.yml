name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable clippy --all-targets --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable doc --no-deps --all-features

  # Compiles everywhere, and runs the tests that need no ICMP socket at all:
  # the reply-map and packet-decoding unit tests are fully deterministic.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --all-targets --all-features
      - run: cargo +stable test --lib --all-features

  # The crate declares rust-version = 1.85.0. Edition 2024 implies Cargo's
  # MSRV-aware resolver, so dependencies are picked to suit it even though this
  # repository does not commit a lockfile.
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --all-targets --all-features

  # Everything above is hermetic. This job is the only one that opens a real
  # ICMP socket, so it is kept separate: a runner without ping permissions
  # should not look like a code failure.
  network-test:
    name: network tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal

      # Linux gates unprivileged ICMP (SOCK_DGRAM) behind a group range that is
      # empty by default on GitHub runners. Note this controls IPv6 ping sockets
      # too — there is no net.ipv6.ping_group_range.
      - name: Enable unprivileged ICMP sockets
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Verify an ICMP socket can be opened
        run: |
          set -eu
          if ! ping -c 1 -W 2 127.0.0.1 >/dev/null 2>&1; then
            echo "::warning::ICMP appears unavailable on this runner"
          fi

      - run: cargo +stable test --all-features

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        # Built from source, so do not hold a third-party tool to this
        # repository's warning policy.
        env:
          RUSTFLAGS: ""
        run: cargo +stable install cargo-audit --locked
      # No lockfile is committed, so resolve one for the audit to read.
      - run: cargo +stable generate-lockfile
      - run: cargo +stable audit
